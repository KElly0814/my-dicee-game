<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dicee game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header>
      <div class="head">
        <h1>🎲🎲 Dice <span>Game</span></h1>
        <p>Roll the dice and see who wins!</p>
      </div>
      <div class="left">
        <a href="">Simple. Fun. Play Anytime.</a>
      </div>
    </header>
    <section class="game">
    <div class="players">
      <div class="player1 ">
        <h2 class="first">Player 1</h2>
        <p class="roll">Roll first</p>
        <img src="images/dice1.png" alt="dice">
      </div>


      <div class="VS">
        <img class="commit" src="./images/dica_game_vs.png" alt="VS">
      </div>

      <div class="player2 ">
        <h2 class="second">Player 2</h2>
        <p class="roll">Your turn</p>
        <img src="images/dice6.png" alt="dice">
      </div>
     </div> 
      <div class="btn">
        <button class="button">🎲Roll Dice</button>
      </div>

      <div class="outcome">
        <h3>Winner is: <span class="winner-name">Player 1</span></h3>
      </div>
    </section>
  </div>

  <footer>
    <div class="footer">
      <p>Made with ❤️ by <a href="https://github.com/KELLy0814" target="_blank">chris dav</a></p>
    </div>
  </footer>
<script src="index.js"charset="UTF-8"></script>
</body>

</html>
